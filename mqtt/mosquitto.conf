# ============================================================
#  FALCRON Mosquitto Configuration
#  File: mqtt/mosquitto.conf
# ============================================================
#  SECURITY: LAN-only. Do NOT expose to the public internet.
# ============================================================

# ---- Listener ----
# Bind to all LAN interfaces so teammates can connect
listener 1883 0.0.0.0

# ---- Authentication ----
# Require username/password (no anonymous access)
allow_anonymous false
password_file C:/Users/shaha/Downloads/FALCRON/mqtt/passwd_file

# ---- Access Control (ACL) ----
acl_file C:/Users/shaha/Downloads/FALCRON/mqtt/acl_file

# ---- Logging ----
log_dest file C:/Users/shaha/Downloads/FALCRON/mqtt/mosquitto.log
log_type all
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ---- Performance ----
max_connections 50
max_inflight_messages 20
max_queued_messages 100

# ---- Security Hardening ----
# Reject clients with IDs longer than 64 chars
max_clientid_len 64
# Max payload 1KB (IoT messages should be small)
message_size_limit 1024
